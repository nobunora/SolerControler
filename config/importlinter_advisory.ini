[importlinter]
root_package = app

[importlinter:contract:energy_plan_stays_independent_of_execution_adapters]
name = Energy plan stays independent of execution adapters
type = forbidden
source_modules =
    app.energy_plan
forbidden_modules =
    app.runtime
    app.dashboard
    app.operations
    app.kpnet

