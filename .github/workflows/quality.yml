name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check quality-gate prerequisites
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pre_release_local.ps1 -CheckPrerequisites
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt uv
      - name: Run local quality gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pre_release_local.ps1 -SkipInstall
