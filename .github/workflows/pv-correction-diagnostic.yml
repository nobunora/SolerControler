name: pv-correction-diagnostic

on:
  push:
    branches:
      - analysis/pv-correction-root-cause-simulation
      - analysis/pv-adaptive-correction-gate
    paths:
      - scripts/diagnose_hourly_pv_correction_limits.py
      - scripts/diagnose_hourly_pv_regime_bias.py
      - scripts/diagnose_hourly_pv_adaptive_gate.py
      - docs/current/product/evidence/hourly_vector_dataset_2026-08-23.csv
      - .github/workflows/pv-correction-diagnostic.yml
  pull_request:
    paths:
      - scripts/diagnose_hourly_pv_correction_limits.py
      - scripts/diagnose_hourly_pv_regime_bias.py
      - scripts/diagnose_hourly_pv_adaptive_gate.py
      - docs/current/product/evidence/hourly_vector_dataset_2026-08-23.csv
      - .github/workflows/pv-correction-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile diagnostic scripts
        run: >-
          python -m py_compile
          scripts/diagnose_hourly_pv_correction_limits.py
          scripts/diagnose_hourly_pv_regime_bias.py
          scripts/diagnose_hourly_pv_adaptive_gate.py
      - name: Run frozen-snapshot analog diagnostic
        run: >-
          python scripts/diagnose_hourly_pv_correction_limits.py
          --output artifacts/analysis/hourly_pv_correction_diagnostic.json
      - name: Run recent-regime bias diagnostic
        run: >-
          python scripts/diagnose_hourly_pv_regime_bias.py
          --output artifacts/analysis/hourly_pv_regime_bias_diagnostic.json
      - name: Run adaptive correction gate diagnostic
        run: >-
          python scripts/diagnose_hourly_pv_adaptive_gate.py
          --output artifacts/analysis/hourly_pv_adaptive_gate_diagnostic.json
